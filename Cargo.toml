[package]
name = "simpleplug"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "simpleplug-daemon"
path = "src/simpleplug/simpleplug_daemon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "process", "fs", "time"] }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
